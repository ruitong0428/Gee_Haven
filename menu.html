<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu · Gee Haven</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script><script src="js/app.js"></script>
</head><body>
<header class="topbar"><div class="container nav">
<a class="brand" href="index.html"><img src="assets/logo.png" alt="Gee Haven"><span>Gee Haven</span></a>
<nav class="navlinks">
<a href="index.html">Home</a><a href="about.html">About</a><a href="menu.html">Menu</a><a href="orders.html">My Orders</a>
<a class="pill" href="menu.html">Cart (<span data-cart-count>0</span>)</a>
<span class="pill" data-auth-user style="display:none"></span>
<a data-admin-link href="admin/index.html" class="pill" style="display:none">🛠️ 后台</a>
<a data-login-link href="login.html">Login</a>
<button data-logout-nav class="btn secondary" style="display:none">Logout</button>
</nav></div></header>

<main class="section"><div class="container">
<div class="page-head"><h1 class="page-title">Our Menu</h1><p class="sub">Choose your favourites and add them to your cart.</p></div>
<div class="menu-layout">
<aside class="sidebar" id="categorySidebar"><button class="category active" data-category="All">✨ All</button></aside>
<section>
<div class="toolbar"><input id="menuSearch" placeholder="Search menu..."><button class="btn" onclick="toggleCart()">Cart (<span data-cart-count>0</span>) · <span data-cart-total>RM 0.00</span></button></div>
<div id="menuGrid" class="menu-grid"></div>
</section></div></div></main>
<div id="cartDrawer" class="cart-drawer hidden">
<div class="cart-head"><h2>Your Cart</h2><button class="btn secondary" onclick="toggleCart()">Close</button></div>
<div id="cartItems" class="cart-items"></div>
<div class="total-line"><span>Subtotal</span><span id="cartSubtotal">RM 0.00</span></div>
<a class="btn" style="width:100%" href="checkout.html">Checkout</a>
</div>
<script src="js/menu.js"></script><script src="js/ai.js"></script>

<footer class="footer"><div class="container center">© 2026 Gee Haven · Good Food, Good Mood, Good Moments</div></footer>
